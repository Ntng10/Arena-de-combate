<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Arena de Combate v0.2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;touch-action:none;font-family:system-ui,sans-serif}#game{width:100vw;height:100dvh}#loading{position:absolute;inset:0;display:grid;place-items:center;color:white;background:#101827;z-index:20;text-align:center;padding:24px}#loading small{display:block;color:#aab6ca;margin-top:12px}#restart-overlay{display:none;position:fixed;left:50%;top:55%;transform:translate(-50%,-50%);z-index:100;border:3px solid #b8f0da;border-radius:14px;background:#276b58;color:white;font:bold clamp(15px,3vw,23px) system-ui,sans-serif;padding:16px 22px;white-space:nowrap;touch-action:manipulation}#restart-overlay.show{display:block}</style></head><body><div id="loading">Carregando Arena de Combate…<small>É necessário ter internet para carregar o Phaser.</small></div><div id="game"></div><button id="restart-overlay" type="button">JOGAR NOVAMENTE</button><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
if(!window.Phaser){document.getElementById('loading').innerHTML='Não foi possível carregar o Phaser.<small>Verifique a conexão e recarregue a página.</small>';}else{
const W=960,H=540;class Arena extends Phaser.Scene{constructor(){super('Arena')}
create(){this.cameras.main.setBackgroundColor('#172333');this.add.rectangle(480,270,910,480,0x233d39).setStrokeStyle(6,0x91a28a);for(let x=80;x<900;x+=80)for(let y=75;y<470;y+=80)this.add.circle(x,y,2,0x3a5a50,.55);this.add.text(480,15,'ARENA DE COMBATE  •  v0.2',{fontFamily:'Arial',fontSize:'22px',color:'#f5e9c9',fontStyle:'bold'}).setOrigin(.5,0);
this.player={x:280,y:260,hp:100,face:{x:1,y:0},last:-9999,rollUntil:0,rollReady:0,guard:false};this.enemy={x:680,y:260,hp:100,last:-9999};this.ended=false;this.move={x:0,y:0};this.pointerId=null;this.guardPointers=new Set();this.joyKnob=this.add.circle(120,423,27,0x9bc5dd,.85).setDepth(11);this.add.circle(120,423,66,0x142033,.75).setStrokeStyle(3,0xb8c9d5,.65).setDepth(10);this.joyKnob.setDepth(11);
this.button(844,426,57,0x762c36,'ATACAR');this.button(730,437,40,0x295d82,'ESQUIVA',15);this.button(845,332,40,0x526c47,'DEFESA',15);
this.pBar=this.add.graphics().setDepth(5);this.eBar=this.add.graphics().setDepth(5);this.playerBody=this.add.container(280,260);this.enemyBody=this.add.container(680,260);this.drawFighter(this.playerBody,0x3b82f6,0xd9eaff);this.drawFighter(this.enemyBody,0xd84949,0xffdddd);this.slash=this.add.graphics().setDepth(7);this.message=this.add.text(480,190,'',{fontFamily:'Arial',fontSize:'46px',fontStyle:'bold',color:'#ffffff',stroke:'#0b1522',strokeThickness:6}).setOrigin(.5).setDepth(20);
document.getElementById('restart-overlay').classList.remove('show');this.input.on('pointerdown',p=>{const v={x:p.x,y:p.y};if(v.x<235&&v.y>300&&this.pointerId===null){this.pointerId=p.id;this.setJoy(v)}else if(Math.hypot(v.x-845,v.y-332)<48){this.guardPointers.add(p.id);this.player.guard=true}else if(Math.hypot(v.x-730,v.y-437)<48){this.dodge()}else if(Math.hypot(v.x-844,v.y-426)<70){this.attack()}});this.input.on('pointermove',p=>{if(p.id===this.pointerId)this.setJoy({x:p.x,y:p.y})});const release=p=>{if(p.id===this.pointerId){this.pointerId=null;this.move={x:0,y:0};this.joyKnob.setPosition(120,423)}this.guardPointers.delete(p.id);this.player.guard=this.guardPointers.size>0};this.input.on('pointerup',release);this.input.on('pointerupoutside',release);this.input.on('gameout',()=>{this.pointerId=null;this.move={x:0,y:0};this.guardPointers.clear();this.player.guard=false;this.joyKnob.setPosition(120,423)});this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE,SHIFT,E');this.drawBars();document.getElementById('loading').remove()}
button(x,y,r,color,label,size=17){this.add.circle(x,y,r,color,.88).setStrokeStyle(3,0xffffff,.7).setDepth(10);this.add.text(x,y,label,{fontFamily:'Arial',fontSize:size+'px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5).setDepth(11)}
drawFighter(c,color,detail){c.add([this.add.ellipse(0,19,47,16,0x081019,.5),this.add.circle(0,0,23,color).setStrokeStyle(3,detail),this.add.rectangle(0,-7,25,9,detail),this.add.circle(-8,-9,3,0x172333),this.add.circle(8,-9,3,0x172333)]);c.setDepth(6)}
setJoy(v){let dx=v.x-120,dy=v.y-423,len=Math.hypot(dx,dy),scale=Math.min(1,len/66);if(len>0){this.move={x:dx/len*scale,y:dy/len*scale};this.joyKnob.setPosition(120+this.move.x*50,423+this.move.y*50)}}
attack(){const p=this.player,e=this.enemy,now=this.time.now;if(this.ended||p.guard||now<p.rollUntil||now-p.last<500)return;p.last=now;const f=p.face,dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy),dot=dist?(dx*f.x+dy*f.y)/dist:1,a=Math.atan2(f.y,f.x);this.slash.clear().lineStyle(12,0xffe3a1,1).beginPath().arc(p.x,p.y,62,a-.7,a+.7,false).strokePath();this.time.delayedCall(150,()=>this.slash.clear());if(dist<82&&dot>.48){e.hp=Math.max(0,e.hp-20);this.cameras.main.shake(65,.003);this.drawBars();this.checkEnd()}}
dodge(){let p=this.player,t=this.time.now;if(this.ended||p.guard||t<p.rollReady)return;p.rollReady=t+1300;p.rollUntil=t+220;this.cameras.main.flash(80,80,150,220,false)}
drawBars(){this.pBar.clear();this.eBar.clear();for(const [g,x,hp,color] of [[this.pBar,60,this.player.hp,0x4ba9ff],[this.eBar,700,this.enemy.hp,0xff6969]]){g.fillStyle(0x0c1420).fillRoundedRect(x,57,200,20,5);g.fillStyle(color).fillRoundedRect(x+3,60,194*hp/100,14,3)}if(this.pLabel)this.pLabel.destroy();if(this.eLabel)this.eLabel.destroy();this.pLabel=this.add.text(60,82,`JOGADOR  ${this.player.hp}/100 HP`,{fontFamily:'Arial',fontSize:'17px',color:'#eaf5ff'});this.eLabel=this.add.text(700,82,`INIMIGO  ${this.enemy.hp}/100 HP`,{fontFamily:'Arial',fontSize:'17px',color:'#ffe7e7'})}
checkEnd(){if(this.ended)return;if(this.player.hp<=0||this.enemy.hp<=0){this.ended=true;this.message.setText(this.player.hp>0?'VITÓRIA!':'DERROTA!');document.getElementById('restart-overlay').classList.add('show')}}
update(time,delta){if(this.ended)return;const dt=Math.min(delta/1000,.05),p=this.player,e=this.enemy;let mx=this.move.x,my=this.move.y;if(this.keys){mx+=(this.keys.D.isDown||this.keys.RIGHT.isDown?1:0)-(this.keys.A.isDown||this.keys.LEFT.isDown?1:0);my+=(this.keys.S.isDown||this.keys.DOWN.isDown?1:0)-(this.keys.W.isDown||this.keys.UP.isDown?1:0);if(Phaser.Input.Keyboard.JustDown(this.keys.SPACE))this.attack();if(Phaser.Input.Keyboard.JustDown(this.keys.SHIFT))this.dodge();p.guard=this.guardPointers.size>0||this.keys.E.isDown}let m=Math.hypot(mx,my);if(m>.08){mx/=Math.max(1,m);my/=Math.max(1,m);if(time>=p.rollUntil)p.face={x:mx/Math.hypot(mx,my),y:my/Math.hypot(mx,my)}}let rolling=time<p.rollUntil,speed=rolling?560:p.guard?90:215,dxm=rolling?p.face.x:mx,dym=rolling?p.face.y:my;p.x=Phaser.Math.Clamp(p.x+dxm*speed*dt,65,895);p.y=Phaser.Math.Clamp(p.y+dym*speed*dt,120,450);let dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);if(dist>62){e.x=Phaser.Math.Clamp(e.x+dx/dist*105*dt,65,895);e.y=Phaser.Math.Clamp(e.y+dy/dist*105*dt,120,450)}else if(time-e.last>=500){e.last=time;if(!rolling){p.hp=Math.max(0,p.hp-(p.guard?3:10));this.cameras.main.shake(90,.004);this.drawBars();this.checkEnd()}}this.playerBody.setPosition(p.x,p.y).setAlpha(rolling?.6:1);this.enemyBody.setPosition(e.x,e.y);this.playerBody.rotation=Math.atan2(p.face.y,p.face.x)+Math.PI/2;this.enemyBody.rotation=Math.atan2(p.y-e.y,p.x-e.x)+Math.PI/2}}
document.getElementById('restart-overlay').addEventListener('click',()=>window.location.reload());new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#172333',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:4},scene:[Arena],render:{pixelArt:false,antialias:true}});
}</script></body></html>
