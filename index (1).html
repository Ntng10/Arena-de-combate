<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Arena de Combate v0.3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;touch-action:none;font-family:system-ui,sans-serif}#game{width:100vw;height:100dvh}#loading{position:absolute;inset:0;display:grid;place-items:center;color:white;background:#101827;z-index:20;text-align:center;padding:24px}#loading small{display:block;color:#aab6ca;margin-top:12px}#restart-overlay{display:none;position:fixed;left:50%;top:55%;transform:translate(-50%,-50%);z-index:100;border:3px solid #b8f0da;border-radius:14px;background:#276b58;color:white;font:bold clamp(15px,3vw,23px) system-ui,sans-serif;padding:16px 22px;white-space:nowrap;touch-action:manipulation}#restart-overlay.show{display:block}</style></head><body><div id="loading">Carregando Arena de Combate…<small>É necessário ter internet para carregar o Phaser.</small></div><div id="game"></div><button id="restart-overlay" type="button">JOGAR NOVAMENTE</button><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
if(!window.Phaser){document.getElementById('loading').innerHTML='Não foi possível carregar o Phaser.<small>Verifique a conexão e recarregue a página.</small>';}else{
const W=960,H=540;class Arena extends Phaser.Scene{constructor(){super('Arena')}
create(){this.drawArena();this.add.text(480,15,'ARENA DE COMBATE  •  v0.3',{fontFamily:'Arial',fontSize:'22px',color:'#f5e9c9',fontStyle:'bold'}).setOrigin(.5,0);
this.player={x:280,y:260,hp:100,face:{x:1,y:0},last:-9999,rollUntil:0,rollReady:0,guard:false};this.enemy={x:680,y:260,hp:100,last:-9999};this.ended=false;this.move={x:0,y:0};this.pointerId=null;this.guardPointers=new Set();this.joyKnob=this.add.circle(120,423,27,0x9bc5dd,.85).setDepth(11);this.add.circle(120,423,66,0x142033,.75).setStrokeStyle(3,0xb8c9d5,.65).setDepth(10);this.joyKnob.setDepth(11);
this.button(844,426,57,0x762c36,'ATACAR');this.button(730,437,40,0x295d82,'ESQUIVA',15);this.button(845,332,40,0x526c47,'DEFESA',15);
this.pBar=this.add.graphics().setDepth(5);this.eBar=this.add.graphics().setDepth(5);this.playerBody=this.add.container(280,260);this.enemyBody=this.add.container(680,260);this.drawFighter(this.playerBody,0x3b82f6,0xd9eaff);this.drawFighter(this.enemyBody,0xd84949,0xffdddd);this.slash=this.add.graphics().setDepth(7);this.message=this.add.text(480,190,'',{fontFamily:'Arial',fontSize:'46px',fontStyle:'bold',color:'#ffffff',stroke:'#0b1522',strokeThickness:6}).setOrigin(.5).setDepth(20);
document.getElementById('restart-overlay').classList.remove('show');this.input.on('pointerdown',p=>{const v={x:p.x,y:p.y};if(v.x<235&&v.y>300&&this.pointerId===null){this.pointerId=p.id;this.setJoy(v)}else if(Math.hypot(v.x-845,v.y-332)<48){this.guardPointers.add(p.id);this.player.guard=true}else if(Math.hypot(v.x-730,v.y-437)<48){this.dodge()}else if(Math.hypot(v.x-844,v.y-426)<70){this.attack()}});this.input.on('pointermove',p=>{if(p.id===this.pointerId)this.setJoy({x:p.x,y:p.y})});const release=p=>{if(p.id===this.pointerId){this.pointerId=null;this.move={x:0,y:0};this.joyKnob.setPosition(120,423)}this.guardPointers.delete(p.id);this.player.guard=this.guardPointers.size>0};this.input.on('pointerup',release);this.input.on('pointerupoutside',release);this.input.on('gameout',()=>{this.pointerId=null;this.move={x:0,y:0};this.guardPointers.clear();this.player.guard=false;this.joyKnob.setPosition(120,423)});this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE,SHIFT,E');this.drawBars();document.getElementById('loading').remove()}
button(x,y,r,color,label,size=17){this.add.circle(x,y,r,color,.88).setStrokeStyle(3,0xffffff,.7).setDepth(10);this.add.text(x,y,label,{fontFamily:'Arial',fontSize:size+'px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5).setDepth(11)}
// Static scenery is drawn once; animated fighters reuse a small set of shapes.
drawArena(){
this.cameras.main.setBackgroundColor('#141923');
const g=this.add.graphics();
g.fillStyle(0x343942).fillRoundedRect(23,29,914,486,12);
for(let row=0;row<12;row++)for(let col=0;col<23;col++){
const x=26+col*40,y=32+row*40;
g.fillStyle([0x555b60,0x5d6265,0x62676a,0x50575d][(row*7+col*3)%4]).fillRect(x+1,y+1,38,38);
g.lineStyle(1,0x798087,.35).strokeRect(x+2,y+2,36,36);
}
// Raised stone walls stay outside the original movement bounds.
for(let x=25;x<935;x+=46)for(const y of [32,478]){
g.fillStyle(0x242b35).fillRect(x,y+6,44,27);g.fillStyle(0x8b9091).fillRect(x,y,44,22);g.fillStyle(0xa2a5a1).fillRect(x+2,y,40,4);
}
for(let y=65;y<478;y+=42)for(const x of [25,909]){g.fillStyle(0x858b8b).fillRect(x,y,24,40);g.fillStyle(0xadb0a8).fillRect(x,y,5,38)}
g.lineStyle(3,0xa49a78,.35).strokeCircle(480,270,95);g.lineStyle(2,0xa49a78,.25).strokeCircle(480,270,85);
g.beginPath().moveTo(460,270).lineTo(500,270).moveTo(480,250).lineTo(480,290).strokePath();
for(const [x,color] of [[180,0x315fa5],[780,0xa33940]]){
g.fillStyle(0x181e27,.4).fillRect(x-24,99,52,68);g.fillStyle(color).fillRect(x-25,92,50,57);
g.fillTriangle(x-25,149,x+25,149,x,168);g.lineStyle(3,0xd5bd83).lineBetween(x-29,91,x+29,91);
g.fillStyle(0xe2c994).fillRect(x-3,106,6,30).fillRect(x-12,115,24,6);
}
for(const x of [55,905])for(const y of [180,370]){
g.fillStyle(0x27222a).fillRect(x-5,y,10,26);g.fillStyle(0xdaa85a).fillCircle(x,y,8);g.fillStyle(0xffde87).fillEllipse(x,y-5,8,15);
}
}
drawFighter(c,color,detail){
const shadow=this.add.ellipse(0,19,49,19,0x10151d,.48);c.add(shadow);
const left=this.add.ellipse(-12,16,13,21,0x28313e).setStrokeStyle(2,0x96a6b5);
const right=this.add.ellipse(12,16,13,21,0x28313e).setStrokeStyle(2,0x96a6b5);c.add([left,right]);
c.add(this.add.triangle(0,9,-20,-8,20,-8,25,35,color).setAlpha(.85));
c.add([this.add.ellipse(0,1,43,40,0x7d8e9e).setStrokeStyle(3,0xd3dde2),this.add.rectangle(0,8,23,21,color).setStrokeStyle(2,detail),this.add.circle(-23,0,10,0xa9b7c2).setStrokeStyle(2,0x425263),this.add.circle(23,0,10,0xa9b7c2).setStrokeStyle(2,0x425263)]);
const shield=this.add.container(-27,-8);shield.add([this.add.rectangle(0,0,21,28,color).setStrokeStyle(3,0xd8c596),this.add.triangle(0,17,-10,-5,10,-5,0,9,color),this.add.rectangle(0,1,4,21,detail),this.add.rectangle(0,-2,15,4,detail)]);c.add(shield);
const sword=this.add.container(27,-4);sword.add([this.add.rectangle(0,-22,7,40,0xdce8ed).setStrokeStyle(1,0x627588),this.add.triangle(0,-45,-3,4,3,4,0,-5,0xf3fcff),this.add.rectangle(0,-2,21,5,0xd4b574),this.add.rectangle(0,6,5,12,0x594432),this.add.circle(0,13,4,0xd4b574)]);c.add(sword);
c.add([this.add.ellipse(0,-10,28,31,0xb5c3ce).setStrokeStyle(3,0x4a596b),this.add.rectangle(0,-14,25,8,0x202d3a),this.add.rectangle(0,-11,4,27,0xe2ebed),this.add.rectangle(0,-27,9,13,color).setStrokeStyle(1,detail)]);
c.setDepth(6);c.art={left,right,sword,shield,shadow,phase:0,attackUntil:0,hitUntil:0};
}
animateFighter(body,f,time,dt,walking,guard,rolling){
const a=body.art;a.phase+=walking?dt*(rolling?22:12):0;
const step=walking?Math.sin(a.phase)*5:0;
a.left.y=16+step;a.right.y=16-step;
const attacking=time<a.attackUntil,progress=1-(a.attackUntil-time)/250;
a.sword.rotation=attacking?-.9+Math.max(0,progress)*2.2:Math.sin(a.phase)*.06;
const blend=dt>0?Math.min(1,dt*22):1;
a.shield.x+=((guard?-13:-27)-a.shield.x)*blend;a.shield.y+=((guard?-27:-8)-a.shield.y)*blend;a.shield.rotation+=((guard?.3:0)-a.shield.rotation)*blend;
body.setScale(time<a.hitUntil?1.045:1);body.setAlpha(rolling?.6:time<a.hitUntil?.55:1);
}
hitEffect(x,y,blocked=false){
// Six short-lived strokes per hit; no textures, particle emitter or per-frame allocations.
const spark=this.add.graphics().setDepth(8);spark.lineStyle(blocked?3:4,blocked?0xa9dfff:0xffdf94,1);
for(let i=0;i<6;i++){const a=i*Math.PI/3;spark.lineBetween(x+Math.cos(a)*7,y+Math.sin(a)*7,x+Math.cos(a)*23,y+Math.sin(a)*23)}
this.tweens.add({targets:spark,alpha:0,duration:180,onComplete:()=>spark.destroy()});
}
setJoy(v){let dx=v.x-120,dy=v.y-423,len=Math.hypot(dx,dy),scale=Math.min(1,len/66);if(len>0){this.move={x:dx/len*scale,y:dy/len*scale};this.joyKnob.setPosition(120+this.move.x*50,423+this.move.y*50)}}
attack(){const p=this.player,e=this.enemy,now=this.time.now;if(this.ended||p.guard||now<p.rollUntil||now-p.last<500)return;p.last=now;this.playerBody.art.attackUntil=now+250;const f=p.face,dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy),dot=dist?(dx*f.x+dy*f.y)/dist:1,a=Math.atan2(f.y,f.x);this.slash.clear().lineStyle(16,0xe6ad52,.25).beginPath().arc(p.x,p.y,66,a-.8,a+.8,false).strokePath().lineStyle(7,0xffe3a1,.85).beginPath().arc(p.x,p.y,62,a-.7,a+.7,false).strokePath().lineStyle(2,0xffffff,1).beginPath().arc(p.x,p.y,60,a-.6,a+.6,false).strokePath();this.time.delayedCall(150,()=>this.slash.clear());if(dist<82&&dot>.48){e.hp=Math.max(0,e.hp-20);this.enemyBody.art.hitUntil=now+140;this.hitEffect(e.x,e.y);this.cameras.main.shake(65,.003);this.drawBars();this.checkEnd()}}
dodge(){let p=this.player,t=this.time.now;if(this.ended||p.guard||t<p.rollReady)return;p.rollReady=t+1300;p.rollUntil=t+220;this.cameras.main.flash(80,80,150,220,false)}
drawBars(){this.pBar.clear();this.eBar.clear();for(const [g,x,hp,color] of [[this.pBar,60,this.player.hp,0x4ba9ff],[this.eBar,700,this.enemy.hp,0xff6969]]){g.fillStyle(0x0c1420).fillRoundedRect(x,57,200,20,5);g.fillStyle(color).fillRoundedRect(x+3,60,194*hp/100,14,3)}if(this.pLabel)this.pLabel.destroy();if(this.eLabel)this.eLabel.destroy();this.pLabel=this.add.text(60,82,`JOGADOR  ${this.player.hp}/100 HP`,{fontFamily:'Arial',fontSize:'17px',color:'#eaf5ff'});this.eLabel=this.add.text(700,82,`INIMIGO  ${this.enemy.hp}/100 HP`,{fontFamily:'Arial',fontSize:'17px',color:'#ffe7e7'})}
checkEnd(){if(this.ended)return;if(this.player.hp<=0||this.enemy.hp<=0){this.ended=true;this.message.setText(this.player.hp>0?'VITÓRIA!':'DERROTA!');document.getElementById('restart-overlay').classList.add('show')}}
update(time,delta){if(this.ended){this.animateFighter(this.playerBody,this.player,time,0,false,false,false);this.animateFighter(this.enemyBody,this.enemy,time,0,false,false,false);return;}const dt=Math.min(delta/1000,.05),p=this.player,e=this.enemy;let mx=this.move.x,my=this.move.y;if(this.keys){mx+=(this.keys.D.isDown||this.keys.RIGHT.isDown?1:0)-(this.keys.A.isDown||this.keys.LEFT.isDown?1:0);my+=(this.keys.S.isDown||this.keys.DOWN.isDown?1:0)-(this.keys.W.isDown||this.keys.UP.isDown?1:0);if(Phaser.Input.Keyboard.JustDown(this.keys.SPACE))this.attack();if(Phaser.Input.Keyboard.JustDown(this.keys.SHIFT))this.dodge();p.guard=this.guardPointers.size>0||this.keys.E.isDown}let m=Math.hypot(mx,my);if(m>.08){mx/=Math.max(1,m);my/=Math.max(1,m);if(time>=p.rollUntil)p.face={x:mx/Math.hypot(mx,my),y:my/Math.hypot(mx,my)}}let rolling=time<p.rollUntil,speed=rolling?560:p.guard?90:215,dxm=rolling?p.face.x:mx,dym=rolling?p.face.y:my;p.x=Phaser.Math.Clamp(p.x+dxm*speed*dt,65,895);p.y=Phaser.Math.Clamp(p.y+dym*speed*dt,120,450);let dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);if(dist>62){e.x=Phaser.Math.Clamp(e.x+dx/dist*105*dt,65,895);e.y=Phaser.Math.Clamp(e.y+dy/dist*105*dt,120,450)}else if(time-e.last>=500){e.last=time;this.enemyBody.art.attackUntil=time+250;if(!rolling){p.hp=Math.max(0,p.hp-(p.guard?3:10));this.playerBody.art.hitUntil=time+140;this.hitEffect(p.x,p.y,p.guard);this.cameras.main.shake(90,.004);this.drawBars();this.checkEnd()}}this.animateFighter(this.playerBody,p,time,dt,rolling||m>.08,p.guard,rolling);this.animateFighter(this.enemyBody,e,time,dt,dist>62,false,false);this.playerBody.setPosition(p.x,p.y);this.enemyBody.setPosition(e.x,e.y);this.playerBody.rotation=Math.atan2(p.face.y,p.face.x)+Math.PI/2;this.enemyBody.rotation=Math.atan2(p.y-e.y,p.x-e.x)+Math.PI/2}}
document.getElementById('restart-overlay').addEventListener('click',()=>window.location.reload());new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#172333',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:4},scene:[Arena],render:{pixelArt:false,antialias:true}});
}</script></body></html>
