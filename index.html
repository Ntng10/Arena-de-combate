<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Arena de Combate v0.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;touch-action:none;font-family:system-ui,sans-serif}#game{width:100vw;height:100dvh}#loading{position:absolute;inset:0;display:grid;place-items:center;color:white;background:#101827;z-index:2;text-align:center;padding:24px}#loading small{display:block;color:#aab6ca;margin-top:12px}</style></head><body><div id="loading">Carregando Arena de Combate…<small>É necessário ter internet para carregar o Phaser.</small></div><div id="game"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
if(!window.Phaser){document.getElementById('loading').innerHTML='Não foi possível carregar o Phaser.<small>Verifique a conexão com a internet e recarregue a página.</small>';}else{
const W=960,H=540;class Arena extends Phaser.Scene{constructor(){super('Arena')}create(){this.cameras.main.setBackgroundColor('#172333');this.add.rectangle(480,270,910,480,0x233d39).setStrokeStyle(6,0x91a28a);for(let x=80;x<900;x+=80)for(let y=75;y<470;y+=80)this.add.circle(x,y,2,0x3a5a50,.55);this.add.text(480,18,'ARENA DE COMBATE  •  v0.1',{fontFamily:'Arial',fontSize:'22px',color:'#f5e9c9',fontStyle:'bold'}).setOrigin(.5,0);this.player={x:280,y:260,hp:100,face:{x:1,y:0},last:0};this.enemy={x:680,y:260,hp:100,last:0};this.ended=false;this.move={x:0,y:0};this.pointerId=null;this.joyBase={x:120,y:423};this.joyRadius=66;this.joyBg=this.add.circle(120,423,66,0x142033,.75).setStrokeStyle(3,0xb8c9d5,.65).setScrollFactor(0).setDepth(10);this.joyKnob=this.add.circle(120,423,27,0x9bc5dd,.85).setDepth(11);this.attackBg=this.add.circle(844,423,67,0x762c36,.85).setStrokeStyle(3,0xffa0a0).setDepth(10);this.add.text(844,423,'ATACAR',{fontFamily:'Arial',fontSize:'21px',color:'#fff',fontStyle:'bold'}).setOrigin(.5).setDepth(11);this.pBar=this.add.graphics().setDepth(5);this.eBar=this.add.graphics().setDepth(5);this.playerBody=this.add.container(this.player.x,this.player.y);this.enemyBody=this.add.container(this.enemy.x,this.enemy.y);this.drawFighter(this.playerBody,0x3b82f6,0xd9eaff);this.drawFighter(this.enemyBody,0xd84949,0xffdddd);this.slash=this.add.graphics().setDepth(7);this.message=this.add.text(480,190,'',{fontFamily:'Arial',fontSize:'46px',fontStyle:'bold',color:'#ffffff',stroke:'#0b1522',strokeThickness:6}).setOrigin(.5).setDepth(20);this.restart=this.add.text(480,280,'JOGAR NOVAMENTE',{fontFamily:'Arial',fontSize:'25px',fontStyle:'bold',color:'#ffffff',backgroundColor:'#376e60',padding:{x:22,y:15}}).setOrigin(.5).setInteractive().setDepth(20).setVisible(false);this.restart.on('pointerdown',()=>this.scene.restart());this.input.on('pointerdown',p=>{const pos=this.toWorld(p);if(pos.x<235&&pos.y>300&&this.pointerId===null){this.pointerId=p.id;this.setJoy(pos)}else if(pos.x>735&&pos.y>320)this.attack()});this.input.on('pointermove',p=>{if(p.id===this.pointerId)this.setJoy(this.toWorld(p))});const release=p=>{if(p.id===this.pointerId){this.pointerId=null;this.move={x:0,y:0};this.joyKnob.setPosition(120,423)}};this.input.on('pointerup',release);this.input.on('pointerupoutside',release);this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE');this.drawBars();document.getElementById('loading').remove()}toWorld(p){return{x:p.x,y:p.y}}drawFighter(c,color,detail){c.add([this.add.ellipse(0,19,47,16,0x081019,.5),this.add.circle(0,0,23,color).setStrokeStyle(3,detail),this.add.rectangle(0,-7,25,9,detail),this.add.circle(-8,-9,3,0x172333),this.add.circle(8,-9,3,0x172333)]);c.setDepth(6)}setJoy(p){let dx=p.x-120,dy=p.y-423,len=Math.hypot(dx,dy),scale=Math.min(1,len/66);if(len>0){this.move={x:dx/len*scale,y:dy/len*scale};this.joyKnob.setPosition(120+this.move.x*50,423+this.move.y*50)}}attack(){if(this.ended)return;const now=this.time.now;if(now-this.player.last<500)return;this.player.last=now;let p=this.player,f=p.face,e=this.enemy;let dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy),dot=dist?((dx*f.x+dy*f.y)/dist):1;this.slash.clear();let a=Math.atan2(f.y,f.x);this.slash.lineStyle(12,0xffe3a1,1);this.slash.beginPath();this.slash.arc(p.x,p.y,62,a-.7,a+.7,false);this.slash.strokePath();this.time.delayedCall(130,()=>this.slash.clear());if(dist<82&&dot>.48){e.hp=Math.max(0,e.hp-20);this.cameras.main.shake(65,.003);this.drawBars();this.checkEnd()}}drawBars(){this.pBar.clear();this.eBar.clear();for(const [g,x,hp,color] of [[this.pBar,60,this.player.hp,0x4ba9ff],[this.eBar,700,this.enemy.hp,0xff6969]]){g.fillStyle(0x0c1420).fillRoundedRect(x,57,200,20,5);g.fillStyle(color).fillRoundedRect(x+3,60,194*hp/100,14,3)}if(this.pLabel)this.pLabel.destroy();if(this.eLabel)this.eLabel.destroy();this.pLabel=this.add.text(60,82,`JOGADOR  ${this.player.hp}/100 HP`,{fontFamily:'Arial',fontSize:'17px',color:'#eaf5ff'});this.eLabel=this.add.text(700,82,`INIMIGO  ${this.enemy.hp}/100 HP`,{fontFamily:'Arial',fontSize:'17px',color:'#ffe7e7'})}checkEnd(){if(this.player.hp<=0||this.enemy.hp<=0){this.ended=true;this.message.setText(this.player.hp>0?'VITÓRIA!':'DERROTA!');this.restart.setVisible(true)}}update(time,delta){if(this.ended)return;const dt=Math.min(delta/1000,.05),p=this.player,e=this.enemy;let mx=this.move.x,my=this.move.y;if(this.keys){mx+=(this.keys.D.isDown||this.keys.RIGHT.isDown?1:0)-(this.keys.A.isDown||this.keys.LEFT.isDown?1:0);my+=(this.keys.S.isDown||this.keys.DOWN.isDown?1:0)-(this.keys.W.isDown||this.keys.UP.isDown?1:0);if(Phaser.Input.Keyboard.JustDown(this.keys.SPACE))this.attack()}let m=Math.hypot(mx,my);if(m>.08){mx/=Math.max(1,m);my/=Math.max(1,m);p.x=Phaser.Math.Clamp(p.x+mx*215*dt,65,895);p.y=Phaser.Math.Clamp(p.y+my*215*dt,120,450);p.face={x:mx/Math.hypot(mx,my),y:my/Math.hypot(mx,my)}}let dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);if(dist>62){e.x=Phaser.Math.Clamp(e.x+dx/dist*105*dt,65,895);e.y=Phaser.Math.Clamp(e.y+dy/dist*105*dt,120,450)}else if(time-e.last>=500){e.last=time;p.hp=Math.max(0,p.hp-10);this.cameras.main.shake(90,.004);this.drawBars();this.checkEnd()}this.playerBody.setPosition(p.x,p.y);this.enemyBody.setPosition(e.x,e.y);this.playerBody.rotation=Math.atan2(p.face.y,p.face.x)+Math.PI/2;this.enemyBody.rotation=Math.atan2(p.y-e.y,p.x-e.x)+Math.PI/2}}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#172333',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:3},scene:[Arena],render:{pixelArt:false,antialias:true}});
}
</script></body></html>
